workflows:
  macos-build:
    name: 主持人工作台 macOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Secret scan
        script: |
          python3 tools/secret_scan.py --root .
      - name: Install dependencies
        script: |
          python3 --version
          python3 -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-build.txt
      - name: Build .app
        script: |
          python3 -m PyInstaller --clean --noconfirm HostWorkbench.spec
    artifacts:
      - dist/*.app
